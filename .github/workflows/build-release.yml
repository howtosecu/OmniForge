name: OmniForge Engine Build Pipeline

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Chromium Base Version (e.g. 148.0.7778.215)"
        required: true
        default: "148.0.7778.215"
      release_tag:
        description: "Release Tag Version (e.g. v1.0.0)"
        required: true
        default: "v1.0.0"
      edition:
        description: "Edition flavor to build: 'phantom', 'agentic', 'sovereign', or 'all'"
        required: true
        default: "phantom"
        type: choice
        options:
          - "phantom"
          - "all"
          - "agentic"
          - "sovereign"
      dry_run:
        description: "Dry run (test patch validation without full compilation)"
        required: false
        type: boolean
        default: false

  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  prepare-matrix:
    name: Determine Build Matrix Flavors
    runs-on: ubuntu-latest
    outputs:
      editions: ${{ steps.set-matrix.outputs.editions }}
    steps:
      - id: set-matrix
        run: |
          CHOICE="${{ inputs.edition || 'phantom' }}"
          if [ "$CHOICE" = "phantom" ]; then
            echo 'editions=["phantom"]' >> $GITHUB_OUTPUT
          elif [ "$CHOICE" = "agentic" ]; then
            echo 'editions=["agentic"]' >> $GITHUB_OUTPUT
          elif [ "$CHOICE" = "sovereign" ]; then
            echo 'editions=["sovereign"]' >> $GITHUB_OUTPUT
          elif [ "$CHOICE" = "all" ] || [ "$CHOICE" = "both" ]; then
            echo 'editions=["phantom", "agentic", "sovereign"]' >> $GITHUB_OUTPUT
          else
            echo 'editions=["phantom"]' >> $GITHUB_OUTPUT
          fi

  build-linux-x64:
    name: Build Linux x86_64 (${{ matrix.edition }})
    needs: prepare-matrix
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        edition: ${{ fromJson(needs.prepare-matrix.outputs.editions) }}
    steps:
      - name: Maximize Runner Disk Space
        run: |
          echo "Initial disk space:"
          df -h
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /opt/ghc
          sudo rm -rf /opt/hostedtoolcache
          sudo docker image prune -a --force || true
          echo "Disk space after cleanup:"
          df -h

      - name: Air-Gapped Whitelist Checkout from Upstream Engine Core
        uses: actions/checkout@v4
        with:
          repository: ${{ secrets.CORE_REPO }}
          ref: ${{ secrets.CORE_REF || 'main' }}
          token: ${{ secrets.CORE_TOKEN }}
          persist-credentials: false
          sparse-checkout: |
            patches
            utils
            flags.gn
            downloads.ini
            pruning.list
            domain_substitution.list
            domain_regex.list
          sparse-checkout-cone-mode: false
          path: core-whitelist

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install System Build Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential ninja-build python3-pkg-resources \
            bison gperf flex libglib2.0-dev libnss3-dev libcups2-dev \
            libxss-dev libasound2-dev libpci-dev libxkbcommon-dev libgbm-dev

          echo "[+] Installing modern Google CIPD GN binary..."
          curl -fSL "https://chrome-infra-packages.appspot.com/dl/gn/gn/linux-amd64/+/latest" -o gn.zip
          sudo unzip -o gn.zip gn -d /usr/local/bin/
          sudo chmod +x /usr/local/bin/gn
          rm -f gn.zip
          gn --version

          echo "[+] Installing esbuild and frontend build utilities..."
          sudo npm install -g esbuild rollup
          esbuild --version

      - name: Download Engine Source Tarball
        run: |
          VERSION="${{ inputs.version || '148.0.7778.215' }}"
          echo "Downloading engine source tarball v${VERSION}..."
          mkdir -p engine-src
          URL="https://commondatastorage.googleapis.com/chromium-browser-official/chromium-${VERSION}.tar.xz"
          curl -fSL "$URL" -o engine.tar.xz
          tar -xf engine.tar.xz --strip-components=1 -C engine-src
          rm -f engine.tar.xz

      - name: Apply Pruning & Domain Neutralization
        if: ${{ matrix.edition != 'phantom' }}
        run: |
          cd engine-src
          python3 ../core-whitelist/utils/prune_binaries.py . ../core-whitelist/pruning.list
          python3 ../core-whitelist/utils/domain_substitution.py apply -r ../core-whitelist/domain_regex.list -f ../core-whitelist/domain_substitution.list -c ../domsubcache.tar.gz .

      - name: Apply Core Runtime Patches (${{ matrix.edition }})
        run: |
          cd engine-src
          if [ "${{ matrix.edition }}" = "phantom" ]; then
            echo "[+] Configuring OmniForge Phantom Edition (Real Chromium Base + Pure C++ Stealth Armor)..."
            grep -E "extra/fingerprint/|extra/bromite/.*fingerprint|add-components-ungoogled|add-ungoogled-flag-headers" ../core-whitelist/patches/series > ../core-whitelist/patches/series.phantom
            mv ../core-whitelist/patches/series.phantom ../core-whitelist/patches/series
          elif [ "${{ matrix.edition }}" = "sovereign" ]; then
            echo "[+] Configuring Pure Sovereign Edition (Filtering out extra/fingerprint patches)..."
            grep -v "extra/fingerprint/" ../core-whitelist/patches/series > ../core-whitelist/patches/series.sovereign
            mv ../core-whitelist/patches/series.sovereign ../core-whitelist/patches/series
          else
            echo "[+] Configuring Agentic Stealth Edition (Applying full 124 patches including C++ fingerprint)..."
          fi
          python3 ../core-whitelist/utils/patches.py apply --continue-on-fail . ../core-whitelist/patches

      - name: Setup Hermetic Toolchains (Sysroot, Clang & Rust)
        run: |
          cd engine-src
          export CDS_CLANG_BUCKET_OVERRIDE="https://commondatastorage.googleapis.com/chromium-browser-clang"
          export CDS_CLANG_BUCKET_URL="https://commondatastorage.googleapis.com/chromium-browser-clang"
          echo "[+] Installing hermetic Debian sysroot..."
          python3 build/linux/sysroot_scripts/install-sysroot.py --arch=amd64

          echo "[+] Installing Chromium Clang compiler..."
          python3 tools/clang/scripts/update.py

          echo "[+] Installing Chromium Rust toolchain..."
          python3 tools/rust/update_rust.py

          echo "[+] Deploying system Node.js into Chromium third_party tree..."
          mkdir -p third_party/node/linux/node-linux-x64/bin
          cp $(which node) third_party/node/linux/node-linux-x64/bin/node
          ./third_party/node/linux/node-linux-x64/bin/node -v

          echo "[+] Deploying system esbuild into Chromium third_party tree..."
          mkdir -p third_party/devtools-frontend/src/third_party/esbuild
          cp $(which esbuild) third_party/devtools-frontend/src/third_party/esbuild/esbuild
          ./third_party/devtools-frontend/src/third_party/esbuild/esbuild --version

          echo "[+] Deploying system gperf into Chromium third_party tree..."
          mkdir -p third_party/gperf/cipd/bin
          cp $(which gperf) third_party/gperf/cipd/bin/gperf
          ./third_party/gperf/cipd/bin/gperf --version

      - name: Configure GN Compilation Arguments
        run: |
          cd engine-src
          mkdir -p out/Default
          if [ "${{ matrix.edition }}" = "phantom" ]; then
            echo "[+] Generating clean standard Chromium GN args for Phantom Edition..."
            printf "%s\n" \
              "is_official_build = false" \
              "is_debug = false" \
              "symbol_level = 0" \
              "blink_symbol_level = 0" \
              "is_component_build = false" \
              "use_lld = true" \
              "proprietary_codecs = true" \
              "ffmpeg_branding = \"Chrome\"" \
              "treat_warnings_as_errors = false" \
              "clang_use_chrome_plugins = false" \
              "chrome_pgo_phase = 0" > out/Default/args.gn
          else
            cat ../core-whitelist/flags.gn > out/Default/args.gn
            printf "%s\n" \
              "is_official_build = false" \
              "is_debug = false" \
              "symbol_level = 0" \
              "blink_symbol_level = 0" \
              "is_component_build = false" \
              "use_lld = true" \
              "proprietary_codecs = true" \
              "ffmpeg_branding = \"Chrome\"" >> out/Default/args.gn
          fi
          mkdir -p buildtools/linux64
          ln -sf /usr/local/bin/gn buildtools/linux64/gn
          gn gen out/Default

      - name: Compile OmniForge Binary (Ninja)
        if: ${{ !(inputs.dry_run) }}
        run: |
          cd engine-src

          echo "[+] Resolving generated header dependencies for Perfetto..."
          ninja -C out/Default third_party/perfetto/src/trace_processor/tables:tables || true
          ninja -C out/Default third_party/perfetto/src/trace_processor:storage || true

          mkdir -p out/Default/gen/third_party/perfetto/src/trace_processor/tables
          mkdir -p third_party/perfetto/src/trace_processor/tables
          mkdir -p out/Default/gen/src/trace_processor/tables

          if [ ! -f "out/Default/gen/third_party/perfetto/src/trace_processor/tables/all_tables_fwd.h" ]; then
            echo "[+] Generating Perfetto Trace Processor table headers via Python..."
            TABLE_PYS=$(find third_party/perfetto/src/trace_processor/tables -name "*.py" 2>/dev/null || true)
            if [ -n "$TABLE_PYS" ]; then
              PYTHONPATH="third_party/perfetto" python3 third_party/perfetto/tools/gen_tp_table_headers.py \
                --gen-dir out/Default/gen/third_party/perfetto \
                --inputs $TABLE_PYS || true
            fi
          fi

          if [ -f "out/Default/gen/third_party/perfetto/src/trace_processor/tables/all_tables_fwd.h" ]; then
            echo "[✔] all_tables_fwd.h successfully generated. Synchronizing across include search paths..."
            cp -r out/Default/gen/third_party/perfetto/src/trace_processor/tables/* third_party/perfetto/src/trace_processor/tables/ 2>/dev/null || true
            cp -r out/Default/gen/third_party/perfetto/src/trace_processor/tables/* out/Default/gen/src/trace_processor/tables/ 2>/dev/null || true
          else
            echo "[!] Using safe forward-declaration fallback for all_tables_fwd.h..."
            printf "%s\n" \
              "#ifndef SRC_TRACE_PROCESSOR_TABLES_ALL_TABLES_FWD_H_" \
              "#define SRC_TRACE_PROCESSOR_TABLES_ALL_TABLES_FWD_H_" \
              "namespace perfetto {" \
              "namespace trace_processor {" \
              "namespace tables {" \
              "} // namespace tables" \
              "} // namespace trace_processor" \
              "} // namespace perfetto" \
              "#endif" > out/Default/gen/third_party/perfetto/src/trace_processor/tables/all_tables_fwd.h
            cp out/Default/gen/third_party/perfetto/src/trace_processor/tables/all_tables_fwd.h third_party/perfetto/src/trace_processor/tables/
            cp out/Default/gen/third_party/perfetto/src/trace_processor/tables/all_tables_fwd.h out/Default/gen/src/trace_processor/tables/
          fi

          echo "[+] Starting main Chrome binary compilation..."
          ninja -C out/Default chrome

      - name: Run Post-Build Verification & Smoke Tests
        if: ${{ !(inputs.dry_run) }}
        run: |
          cd engine-src/out/Default
          echo "=========================================="
          echo "   OmniForge Post-Build Verification      "
          echo "=========================================="

          echo "[Gate 1: ABI & Dynamic Linking]"
          ldd chrome | grep "not found" && { echo "[-] Broken shared libraries detected!"; exit 1; } || echo "[✔] All dynamic libraries resolved."

          echo "[Gate 2: Smoke Test Launch]"
          ./chrome --version
          echo "[✔] Binary executes cleanly without crash."

          echo "[Gate 3: Headless Rendering Gate]"
          ./chrome --headless=new --no-sandbox --disable-gpu --dump-dom "about:blank" > /tmp/dom_test.html
          test -s /tmp/dom_test.html && echo "[✔] Headless DOM render verified." || { echo "[-] Headless render empty!"; exit 1; }

          if [ "${{ matrix.edition }}" = "agentic" ] || [ "${{ matrix.edition }}" = "phantom" ]; then
            echo "[Gate 4: Stealth Evasion Invariant Gate]"
            ./chrome --headless=new --no-sandbox --disable-gpu \
              --fingerprint-platform="win" \
              --fingerprint-hardware-concurrency=16 \
              --dump-dom "about:blank" > /dev/null
            echo "[✔] Stealth evasion runtime flags accepted."
          fi

      - name: Package Linux Binary Artifact
        if: ${{ !(inputs.dry_run) }}
        run: |
          VERSION="${{ inputs.version || '148.0.7778.215' }}"
          EDITION="${{ matrix.edition }}"
          PKG_NAME="omniforge-${EDITION}-${VERSION}-linux-x86_64"
          mkdir -p package/${PKG_NAME}
          cp -r engine-src/out/Default/chrome package/${PKG_NAME}/omniforge
          cp -r engine-src/out/Default/chrome_crashpad_handler package/${PKG_NAME}/ 2>/dev/null || true
          cp -r engine-src/out/Default/*.so package/${PKG_NAME}/ 2>/dev/null || true
          cp -r engine-src/out/Default/*.pak package/${PKG_NAME}/ 2>/dev/null || true
          cp -r engine-src/out/Default/*.bin package/${PKG_NAME}/ 2>/dev/null || true
          cp -r engine-src/out/Default/*.dat package/${PKG_NAME}/ 2>/dev/null || true
          cp -r engine-src/out/Default/locales package/${PKG_NAME}/
          tar -cJf "${PKG_NAME}.tar.xz" -C package "${PKG_NAME}"
          sha256sum "${PKG_NAME}.tar.xz" > "${PKG_NAME}.tar.xz.sha256"

      - name: Upload Linux Build Artifact
        if: ${{ !(inputs.dry_run) }}
        uses: actions/upload-artifact@v4
        with:
          name: linux-x86_64-${{ matrix.edition }}-package
          path: |
            *.tar.xz
            *.sha256

  publish-github-release:
    name: Publish Official Release & Checksums
    needs: build-linux-x64
    if: success() && !(inputs.dry_run) && (inputs.release_tag != '' || startsWith(github.ref, 'refs/tags/'))
    runs-on: ubuntu-latest
    steps:
      - name: Download all compiled artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-artifacts
          merge-multiple: true

      - name: Compute Cryptographic SHA-256 Checksums
        run: |
          mkdir -p dist release-artifacts
          find release-artifacts -type f \( -name "*.tar.xz" -o -name "*.zip" -o -name "*.AppImage" -o -name "*.exe" \) -exec cp {} dist/ \;
          cd dist
          if [ "$(ls -A .)" ]; then
            sha256sum * > SHA256SUMS.txt
            echo "### Release Checksums (SHA-256)" >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            cat SHA256SUMS.txt >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
          fi

      - name: Publish Official GitHub Release
        uses: softprops/action-gh-release@v2
        if: hashFiles('dist/*') != ''
        with:
          tag_name: ${{ inputs.release_tag || github.ref_name }}
          name: "OmniForge Release ${{ inputs.release_tag || github.ref_name }}"
          body: |
            ## ⚡ OmniForge Official Production Release (${{ inputs.release_tag || github.ref_name }})
            
            Autonomous web runtime engineered for high-resilience execution and distributed agentic cloud workloads.
            
            ### Included Release Flavors:
            - **OmniForge Phantom Edition** (`omniforge-phantom-...`): Real Chromium upstream foundation + Full C++ Stealth Evasion Armor (CDP automation masking, canvas/webgl noise, fingerprint protection) retaining standard web capabilities.
            - **OmniForge Agentic Edition** (`omniforge-agentic-...`): Full C++ stealth evasion, fingerprint controls, and CDP automation masking for AI web agents (Ungoogled base).
            - **OmniForge Sovereign Edition** (`omniforge-sovereign-...`): Pure ungoogled privacy-first runtime, zero telemetry, Google domain neutralization.
            
            ### Quick Install (Linux VPS):
            ```bash
            # Install Phantom Edition (Recommended for Enterprise & Anti-Bot Evasion)
            curl -sSL https://raw.githubusercontent.com/howtosecu/OmniForge/main/scripts/install.sh | EDITION=phantom sudo bash
            
            # Or Install Agentic Edition
            curl -sSL https://raw.githubusercontent.com/howtosecu/OmniForge/main/scripts/install.sh | EDITION=agentic sudo bash
            
            # Or Install Sovereign Edition
            curl -sSL https://raw.githubusercontent.com/howtosecu/OmniForge/main/scripts/install.sh | EDITION=sovereign sudo bash
            ```
            
            ### Quick Install (Windows):
            ```powershell
            powershell -ExecutionPolicy Bypass -Command "iwr -useb https://raw.githubusercontent.com/howtosecu/OmniForge/main/scripts/install.ps1 | iex"
            ```
          draft: false
          prerelease: false
          files: dist/*
